name: creo_client_portal
description: "Creo Client Portal Mobile Application - Built with Flutter"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking & Real-time
  dio: ^5.5.0
  web_socket_channel: ^3.0.1

  # Security & Storage
  flutter_secure_storage: ^9.2.2

  # Typography & Design
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.19.0

  # Media & Review Experience
  cached_network_image: ^3.3.1
  video_player: ^2.9.1
  chewie: ^1.8.5
  audioplayers: ^6.0.0

  # System & Integrations
  razorpay_flutter: ^1.3.7
  share_plus: ^10.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

